name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config fontconfig fonts-dejavu-core fonts-dejavu-mono

      - name: Verify the tag points at the checked-out commit
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test -z "$(git status --porcelain)"

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --all-targets --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Package archive and checksums
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7.0.1

      - name: Download packaged assets
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify downloaded checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/${tag}.md"
          generated="$RUNNER_TEMP/release-notes.md"

          if [[ -f $notes ]]; then
            cp "$notes" "$generated"
          else
            printf 'Release %s\n\n' "$tag" > "$generated"
          fi
          printf '\n## SHA-256 checksums\n\n```\n' >> "$generated"
          cat dist/SHA256SUMS >> "$generated"
          printf '```\n' >> "$generated"

          prerelease=()
          if [[ $tag == *-* ]]; then
            prerelease=(--prerelease --latest=false)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$generated" "${prerelease[@]}"
            gh release upload "$tag" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "Beyrix $tag" \
              --notes-file "$generated" \
              "${prerelease[@]}"
          fi

          {
            echo "### Beyrix $tag published"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  copr:
    name: Publish Fedora packages
    needs: release
    uses: ./.github/workflows/copr.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
