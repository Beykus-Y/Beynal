id = "beyrix.official.media-player"
name = "Media Player"
version = "1.1.0"
kind = "widget"
sdk_version = "1.0.0"
entry = "index.js"
author = "Beyrix Team"
description = "Adaptive MPRIS2 & local media player with Compact/Normal/Expanded modes, capability-aware controls, and audio visualizer."
license = "MPL-2.0"
official = true
permissions = ["ui", "media-control", "audio-analysis", "theme"]

[[settings_schema]]
key = "viewMode"
label = "View Mode"
kind = "enum"
options = ["auto", "compact", "normal", "expanded"]
default = "auto"

[[settings_schema]]
key = "showVisualizer"
label = "Show Audio Visualizer"
kind = "boolean"
default = true

[placement]
mode = "overlay"
tui_behavior = "hidden"
anchor = "bottom-right"
x = -14.0
y = -14.0
width = 276.0
height = 108.0
min_width = 160.0
max_width = 360.0
min_height = 38.0
max_height = 180.0
margin = 10.0
z_index = 20
priority = 20
opacity = 0.94
border_radius = 10.0
avoid_overlap = true
narrow_behavior = "compact"
