id = "org.beyrix.media-player"
name = "Media Player & Visualizer"
version = "1.0.0"
kind = "widget"
sdk_version = "1.0.0"
entry = "index.js"
author = "Beyrix"
description = "Controls system MPRIS/GSMTC sessions and Beyrix local audio playback with reactive spectrum."
