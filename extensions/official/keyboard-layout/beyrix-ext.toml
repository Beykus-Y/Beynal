id = "beyrix.official.keyboard-layout"
name = "Keyboard Layout"
version = "1.1.0"
kind = "widget"
sdk_version = "1.0.0"
entry = "index.js"
author = "Beyrix Team"
description = "Compact, theme-aware keyboard layout indicator with always/on-switch modes and per-layout colors."
license = "MPL-2.0"
official = true
permissions = ["ui", "keyboard-layout", "theme", "window"]

[[settings_schema]]
key = "mode"
label = "Display Mode"
kind = "enum"
options = ["always", "on-switch"]
default = "always"
description = "Show permanently or briefly on layout switch."

[[settings_schema]]
key = "showFullName"
label = "Show Full Layout Name"
kind = "boolean"
default = false

[[settings_schema]]
key = "hideDelayMs"
label = "Hide Delay (ms)"
kind = "slider"
min = 500.0
max = 5000.0
step = 100.0
default = 1800

[[settings_schema]]
key = "enColor"
label = "EN Accent Color"
kind = "color"
default = "#7aa2f7"

[[settings_schema]]
key = "ruColor"
label = "RU Accent Color"
kind = "color"
default = "#f7768e"

[placement]
mode = "overlay"
tui_behavior = "overlay"
anchor = "top-right"
x = -12.0
y = 10.0
width = 76.0
height = 28.0
min_width = 52.0
max_width = 200.0
min_height = 24.0
max_height = 38.0
margin = 8.0
z_index = 25
priority = 30
opacity = 0.94
border_radius = 8.0
click_through = true
avoid_overlap = true
narrow_behavior = "compact"
