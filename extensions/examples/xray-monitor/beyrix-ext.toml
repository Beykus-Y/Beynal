id = "org.example.xray-monitor"
name = "X-Ray Activity Badge"
version = "1.0.0"
kind = "widget"
sdk_version = "1.0.0"
entry = "index.js"
author = "Beyrix Community"
description = "Example third-party widget displaying active command CPU and wait state via X-Ray SDK."
license = "MPL-2.0"
official = false
permissions = ["ui", "xray-read", "theme"]

[placement]
mode = "overlay"
tui_behavior = "overlay"
anchor = "top-left"
x = 14.0
y = 12.0
width = 240.0
height = 48.0
z_index = 15
opacity = 0.88
border_radius = 8.0
